<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>發明家排序挑戰</title>
<style>
body { font-family: sans-serif; text-align: center; background:#f5f5f5; }
.container { display: flex; justify-content: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.card, .slot { width:120px; height:120px; border-radius:50%; overflow:hidden; }
.card { border:2px dashed #aaa; cursor:grab; }
.slot { border:2px solid #333; }
.card img, .slot img { width:100%; height:100%; object-fit:cover; }
button { margin:10px; padding:10px 20px; }
</style>
</head>
<body>

<div style="display:flex; justify-content:space-between; align-items:center; padding:0 20px;">
<h1 id="title"></h1>
<div id="stars">
<span id="star1" onclick="lightStar(1)">☆</span>
<span id="star2" onclick="lightStar(2)">☆</span>
<span id="star3" onclick="lightStar(3)">☆</span>
</div>
</div>

<p id="instruction"></p>

<div class="container" id="cards"></div>
<div class="container" id="slots"></div>

<button onclick="checkAnswer()">確認答案</button>
<p id="result"></p>
<div id="controls"></div>

<script>

const levels = [
// 1 愛迪生排序
{
 name:"愛迪生（排序）",
 mode:"full",
 images:["./images/e1.png","./images/e2.png","./images/e3.png","./images/e4.png","./images/e5.png","./images/e6.png"]
},
// 2 愛迪生選三
{
 name:"愛迪生（選三張）",
 mode:"partial",
 pick:3,
 images:["./images/e1.png","./images/e2.png","./images/e3.png","./images/e4.png","./images/e5.png","./images/e6.png"]
},
// 3 牛頓
{
 name:"牛頓（排序）",
 mode:"full",
 images:["./images/e7.png","./images/e8.png","./images/e9.png"]
},
// 4 萊特排序
{
 name:"萊特兄弟（排序）",
 mode:"full",
 images:["./images/w1.png","./images/w2.png","./images/w3.png","./images/w4.png"]
},
// 5 萊特選三
{
 name:"萊特兄弟（選三張）",
 mode:"partial",
 pick:3,
 images:["./images/w1.png","./images/w2.png","./images/w3.png","./images/w4.png"]
}
];

let currentLevel = 0;

function loadLevel(){
 resetStars();
 const level = levels[currentLevel];
 document.getElementById("title").innerText = `關卡${currentLevel+1}：${level.name}`;
 document.getElementById("result").innerText = "";

 // 指示文字
 if(level.mode === "partial"){
  document.getElementById("instruction").innerText = "👉 選三張並排序，用『先、再、最後』說故事";
 } else {
  document.getElementById("instruction").innerText = "👉 排序圖片";
 }

 const cardsDiv = document.getElementById("cards");
 const slotsDiv = document.getElementById("slots");
 cardsDiv.innerHTML = "";
 slotsDiv.innerHTML = "";
 
 let shuffled = [...level.images].sort(()=>Math.random()-0.5);
 
 shuffled.forEach(src=>{
  let card = document.createElement("div");
  card.className="card";
  card.draggable=true;

  let img = document.createElement("img");
  img.src = src;
  card.appendChild(img);

  card.ondragstart = e=> e.dataTransfer.setData("text",src);
  cardsDiv.appendChild(card);
 });
 
 let slotCount = level.mode === "partial" ? level.pick : level.images.length;

 for(let i=0;i<slotCount;i++){
  let slot = document.createElement("div");
  slot.className="slot";

  slot.ondragover = e=> e.preventDefault();
  slot.ondrop = e=>{
    let data = e.dataTransfer.getData("text");
    slot.innerHTML = `<img src="${data}">`;
    slot.setAttribute("data-src", data);
  }

  slotsDiv.appendChild(slot);
 }

 renderControls();
}

function checkAnswer(){
 const level = levels[currentLevel];
 const slots = document.querySelectorAll(".slot");
 let correct = true;
 
 if(level.mode === "full"){
   slots.forEach((slot,i)=>{
     if(slot.getAttribute("data-src") !== level.images[i]) correct=false;
   });
 }

 else {
   let chosen = [];
   slots.forEach(slot=>{
     let val = slot.getAttribute("data-src");
     if(!val) correct=false;
     chosen.push(level.images.indexOf(val));
   });

   for(let i=1;i<chosen.length;i++){
     if(chosen[i] <= chosen[i-1]) correct=false;
   }
 }

 document.getElementById("result").innerText = correct ? "答對了！" : "再試一次！";
}

function renderControls(){
 const controls = document.getElementById("controls");
 controls.innerHTML = "";

 controls.innerHTML += `<button onclick="resetLevel()">重設</button>`;

 if(currentLevel > 0){
  controls.innerHTML += `<button onclick="prevLevel()">上一關</button>`;
 }

 if(currentLevel < levels.length -1){
  controls.innerHTML += `<button onclick="nextLevel()">下一關</button>`;
 }

 if(currentLevel === levels.length -1){
  controls.innerHTML += `<button onclick="goStart()">回到第一關</button>`;
 }
}

function nextLevel(){ currentLevel++; loadLevel(); }
function prevLevel(){ currentLevel--; loadLevel(); }
function resetLevel(){ loadLevel(); }
function goStart(){ currentLevel=0; loadLevel(); }

function lightStar(num){ document.getElementById("star"+num).innerText="★"; }
function resetStars(){ for(let i=1;i<=3;i++){document.getElementById("star"+i).innerText="☆";} }

loadLevel();
</script>

</body>
</html>
